<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Arias Barber Studio</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="form-card" style="width: 100%; max-width: 400px;">
        <div class="section-header" style="text-align: center;">
            <h2 style="color: var(--accent-gold);">Recuperar Acceso</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Ingresa tu correo para recibir las instrucciones</p>
        </div>
        <form id="form-recuperar" class="modern-form">
            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="rec-email" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Enviar Enlace</button>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Volver al Inicio</a>
            </div>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>

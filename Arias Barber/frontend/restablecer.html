<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Arias Barber Studio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="form-card" style="width: 100%; max-width: 400px;">
        <div class="section-header" style="text-align: center;">
            <h2 style="color: var(--accent-gold);">Nueva Contraseña</h2>
            <p style="color: var(--text-muted);">Ingresa tu nueva clave de acceso</p>
        </div>
        <form id="form-nueva-clave" class="modern-form">
            <div class="input-group">
                <label>Nueva Contraseña</label>
                <input type="password" id="nueva-pass" required minlength="6">
            </div>
            <div class="input-group">
                <label>Confirmar Contraseña</label>
                <input type="password" id="confirmar-pass" required minlength="6">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Guardar Contraseña</button>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Volver al inicio de sesión</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('form-nueva-clave').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('nueva-pass').value;
            const confirmPass = document.getElementById('confirmar-pass').value;

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Enlace no válido o incompleto.', confirmButtonColor: '#d4af37' });
                return;
            }

            if (pass !== confirmPass) {
                Swal.fire({ icon: 'warning', title: 'Atención', text: 'Las contraseñas no coinciden.', confirmButtonColor: '#d4af37' });
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/restablecer-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, nuevaPassword: pass })
                });

                const data = await response.json();

                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Actualizada!',
                        text: 'Tu contraseña ha sido cambiada con éxito. Ya puedes iniciar sesión.',
                        confirmButtonColor: '#d4af37'
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'Enlace expirado', text: data.error, confirmButtonColor: '#d4af37' });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Error al conectar con el servidor.' });
            }
        });
    </script>
</body>
</html>
